name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Install Python, Koji, and tarpm
        run: |
          dnf -y install python3 git koji dnf5-plugins
          dnf -y copr enable dcantrell/tarpm
          dnf -y install tarpm
          python3 --version
          rpm -q koji tarpm

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Unit and regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Real hello RPM smoke tests
        run: python3 .github/scripts/smoke-test.py --output "$RUNNER_TEMP/hello-smoke"

      - name: Upload smoke-test reports, logs, and RPM artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hello-smoke
          path: ${{ runner.temp }}/hello-smoke
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
